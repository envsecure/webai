services:
  webai:
    build:
      context: .
      dockerfile: Dockerfile
    image: webai:latest
    container_name: webai
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      SQLITE_FILE: /app/data/app.db
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-before-going-live}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-2592000}
    volumes:
      - webai-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webai-data:
